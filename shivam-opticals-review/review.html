<style>
:root{
  --red:#C8102E;        /* accent red  – change to your site's exact red */
  --red-dark:#A00D25;
  --navy:#0B1F3A;       /* dark navy   – change to your site's exact navy */
  --ink:#1B2A41;
  --muted:#5F6B7C;
  --line:#E3DED5;
  --bg:#FBF8F3;
  --card:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
.top{background:var(--navy);color:#fff}
.top-in{max-width:560px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:"Fraunces","Noto Serif Devanagari",Georgia,serif;font-weight:700;font-size:19px;letter-spacing:.2px}
.brand small{display:block;font:500 11px/1.2 "Manrope","Noto Sans Devanagari",sans-serif;opacity:.7;letter-spacing:.8px;text-transform:uppercase}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;font:600 13px "Manrope","Noto Sans Devanagari",sans-serif;padding:7px 14px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
main{max-width:560px;margin:0 auto;padding:24px 20px 48px}
h1{font-family:"Fraunces","Noto Serif Devanagari",Georgia,serif;font-weight:700;font-size:28px;line-height:1.2;margin:0 0 8px;color:var(--navy)}
.lead{color:var(--muted);margin:0 0 22px}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin:0 0 14px}
.step h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:700 16px/1.3 "Manrope","Noto Sans Devanagari",sans-serif;color:var(--navy)}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font:700 13px/26px "Manrope",sans-serif;text-align:center}
.group{margin:14px 0 0}
.group:first-of-type{margin-top:0}
.group h3{margin:0 0 8px;font:600 13px/1.3 "Manrope","Noto Sans Devanagari",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
html[lang="hi"] .group h3{text-transform:none;letter-spacing:0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);font:600 14px/1.2 "Manrope","Noto Sans Devanagari",sans-serif;padding:10px 14px;border-radius:99px;cursor:pointer;transition:background .12s,border-color .12s,color .12s;min-height:42px}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.branch{flex:1 1 140px;text-align:center;font-size:15px;padding:13px 14px}
.chip.branch[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.err{color:var(--red-dark);font-weight:600;font-size:14px;margin:8px 0 0}
label.fl{display:block;font:600 13px/1.3 "Manrope","Noto Sans Devanagari",sans-serif;color:var(--muted);margin:14px 0 6px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:400 16px/1.55 "Manrope","Noto Sans Devanagari",system-ui,sans-serif;color:var(--ink);background:#fff}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,31,58,.12)}
.btn{display:block;width:100%;border:0;border-radius:99px;padding:15px 18px;font:700 16px/1.2 "Manrope","Noto Sans Devanagari",sans-serif;cursor:pointer;text-align:center;text-decoration:none;color:#fff;background:var(--red);transition:background .12s,opacity .12s}
.btn:hover{background:var(--red-dark)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.navy{background:var(--navy)}
.btn.navy:hover{background:#142C50}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#F4F0E8}
.row{display:flex;gap:10px;margin-top:12px}
.row .btn{flex:1}
.steps-list{margin:14px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.steps-list li{margin:3px 0}
.note{font-size:13px;color:var(--muted);margin:16px 2px 0}
.ok{color:#176B3A;font-weight:600;font-size:14px;margin:8px 0 0}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">Shivam Opticals<small id="tag">Sultanpur</small></div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
  </div>
</div></header>

<main>
  <h1 id="t-title"></h1>
  <p class="lead" id="t-lead"></p>

  <section class="step">
    <h2><span class="num">1</span><span id="t-branch"></span></h2>
    <div class="chips" id="branches"></div>
    <p class="err" id="branch-err" hidden></p>
  </section>

  <section class="step">
    <h2><span class="num">2</span><span id="t-tap"></span></h2>
    <div id="groups"></div>
    <p class="hint" id="t-tap-hint"></p>
  </section>

  <section class="step">
    <h2><span class="num">3</span><span id="t-draft"></span></h2>
    <button type="button" class="btn navy" id="make"></button>
    <p class="hint" id="make-hint" hidden></p>
    <label class="fl" for="mem" id="t-mem"></label>
    <input type="text" id="mem" maxlength="140" autocomplete="off">
    <label class="fl" for="text" id="t-text"></label>
    <textarea id="text"></textarea>
    <p class="hint" id="t-edit"></p>
  </section>

  <section class="step">
    <h2><span class="num">4</span><span id="t-post"></span></h2>
    <div class="row">
      <button type="button" class="btn ghost" id="copy"></button>
      <a class="btn" id="open" href="#" target="_blank" rel="noopener"></a>
    </div>
    <p class="ok" id="copied" hidden></p>
    <ol class="steps-list" id="after"></ol>
  </section>

  <p class="note" id="t-note"></p>
</main>

    comfy: ["चश्मे की फ़िटिंग आरामदायक है।","नया चश्मा पहनने में आरामदायक लगता है।","फ्रेम आराम से बैठता है।","फ़िट अच्छा और आरामदायक है।","चश्मा पहनकर आराम महसूस हुआ।","फ़िटिंग बिल्कुल आरामदायक रही।"],
    ontime: ["चश्मा समय पर तैयार मिला।","जो समय बताया गया था, उसी पर काम हो गया।","काम तय समय पर पूरा हुआ।","डिलीवरी समय पर मिली।","बताए हुए समय पर चश्मा तैयार था।","ऑर्डर समय पर तैयार हो गया।"]
  }
};
/* Openers and closers are strictly factual / courtesy. They add no opinion. */
const OPEN = {
  en: ["I recently visited Shivam Opticals, {b} branch.","I visited the {b} branch of Shivam Opticals.","Sharing this after my visit to Shivam Opticals, {b}.","I went to Shivam Opticals ({b} branch) recently."],
  hi: ["शिवम ऑप्टिकल्स, {b} शाखा में हाल ही में आना हुआ।","हाल ही में शिवम ऑप्टिकल्स ({b}) जाना हुआ।","शिवम ऑप्टिकल्स की {b} शाखा का मेरा अनुभव।","{b} में शिवम ऑप्टिकल्स पर हाल ही में आना हुआ।"]
};
const CLOSE = {
  en: ["Thank you.", "Thanks.", "Thank you, Shivam Opticals.", ""],
  hi: ["धन्यवाद।", "शुक्रिया।", "धन्यवाद, शिवम ऑप्टिकल्स।", ""]
};

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
let lang = "en", branch = "", chosen = new Set(), dirty = false, hasDraft = false, lastDraft = "", busy = false;

try { const s = sessionStorage.getItem("sh_lang"); if (s === "hi" || s === "en") lang = s;
      else if ((navigator.language || "").toLowerCase().startsWith("hi")) lang = "hi"; } catch (e) {}
const qb = new URLSearchParams(location.search).get("b");
if (qb && BRANCHES[qb.toLowerCase()]) branch = qb.toLowerCase();

const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const t = () => UI[lang];

/* ---------- local composer (fallback) ---------- */
function composeLocal(lg, br, ids, mem) {
  if (!ids.length) return "";
  const bn = br ? BRANCHES[br][lg] : (lg === "hi" ? "सुल्तानपुर" : "Sultanpur");
  const groupOf = {}; GROUPS.forEach(g => g.chips.forEach(c => groupOf[c[0]] = g.id));
  const visit = shuffle(ids.filter(i => groupOf[i] === "a")), rest = shuffle(ids.filter(i => groupOf[i] !== "a"));
  const sentences = [pick(OPEN[lg]).replace("{b}", bn)];
  visit.concat(rest).forEach(id => sentences.push(pick(BANK[lg][id])));
  if (mem) sentences.push(mem);
  const c = pick(CLOSE[lg]); if (c) sentences.push(c);
  return sentences.join(" ");
}

/* ---------- AI helper (optional) ---------- */
function validAI(x) {
  if (x.length < 15 || x.length > 800) return false;
  const dev = (x.match(/[\u0900-\u097F]/g) || []).length;
  return lang === "hi" ? dev >= 10 : dev === 0;
}
async function composeAI(ids) {
  if (!WORKER_URL) return null;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), WORKER_TIMEOUT_MS);
  try {
    const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, signal: ctl.signal,
      body: JSON.stringify({ lang: lang, branch: branch || "", chips: ids }) });
    if (!r.ok) return null;
    const j = await r.json();
    return (j && typeof j.text === "string" && validAI(j.text.trim())) ? j.text.trim() : null;
  } catch (e) { return null; } finally { clearTimeout(timer); }
}

/* ---------- rendering ---------- */
function renderStatic() {
  const T = t();
  document.documentElement.lang = lang;
  document.title = (lang === "hi" ? "अपना अनुभव साझा करें" : "Share your experience") + " – Shivam Opticals";
  $("tag").textContent = T.tag;
  $("t-title").textContent = T.title; $("t-lead").textContent = T.lead;
  $("t-branch").textContent = T.branch; $("t-tap").textContent = T.tap; $("t-tap-hint").textContent = T.tapHint;
  $("t-draft").textContent = T.draft; $("t-mem").textContent = T.mem; $("mem").placeholder = T.memPh;
  $("t-text").textContent = T.text; $("text").placeholder = T.textPh; $("t-edit").textContent = T.edit;
  $("t-post").textContent = T.post; $("copy").textContent = T.copy; $("open").textContent = T.open;
  $("t-note").textContent = T.note;
  $("after").replaceChildren(...T.after.map(s => { const li = document.createElement("li"); li.textContent = s; return li; }));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderBranches(); renderGroups(); updateButtons();
  $("copied").hidden = true; $("branch-err").hidden = true;
}
function chipButton(label, pressed, onclick, extra) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip" + (extra ? " " + extra : ""); b.textContent = label;
  b.setAttribute("aria-pressed", String(pressed)); b.addEventListener("click", onclick); return b;
}
function renderBranches() {
  const box = $("branches"); box.replaceChildren();
  Object.keys(BRANCHES).forEach(k => box.append(chipButton(BRANCHES[k][lang], branch === k, () => { branch = k; $("branch-err").hidden = true; renderBranches(); updateOpen(); }, "branch")));
}
function renderGroups() {
  const box = $("groups"); box.replaceChildren();
  GROUPS.forEach(g => {
    const wrap = document.createElement("div"); wrap.className = "group";
    const h = document.createElement("h3"); h.textContent = g[lang]; wrap.append(h);
    const row = document.createElement("div"); row.className = "chips";
    g.chips.forEach(c => row.append(chipButton(lang === "hi" ? c[2] : c[1], chosen.has(c[0]), ev => {
      if (chosen.has(c[0])) chosen.delete(c[0]); else chosen.add(c[0]);
      ev.currentTarget.setAttribute("aria-pressed", String(chosen.has(c[0]))); updateButtons();
    })));
    wrap.append(row); box.append(wrap);
  });
}
function updateButtons() {
  const T = t(), m = $("make");
  m.textContent = busy ? T.writing : (hasDraft ? T.remake : T.make);
  m.disabled = busy || chosen.size === 0;
  const h = $("make-hint"); h.textContent = T.needTap; h.hidden = chosen.size !== 0;
  updateOpen();
}
function updateOpen() {
  const a = $("open");
  a.href = branch ? BRANCHES[branch].link : "#";
}

/* ---------- actions ---------- */
async function makeDraft() {
  const T = t(); if (busy) return;
  const ids = GROUPS.flatMap(g => g.chips.map(c => c[0])).filter(id => chosen.has(id));
  if (!ids.length) return;                       // never write a draft without taps
  const box = $("text");
  if (dirty && box.value.trim() && !window.confirm(T.confirmReplace)) return;
  busy = true; updateButtons();
  let mem = $("mem").value.trim();
  if (mem && !/[.!?।]$/.test(mem)) mem += (lang === "hi" ? "।" : ".");
  let body = await composeAI(ids), out;
  if (body) {
    out = mem ? body.replace(/\s+$/, "") + " " + mem : body;
  } else {
    for (let i = 0; i < 6; i++) { out = composeLocal(lang, branch, ids, mem); if (out !== lastDraft) break; }
  }
  box.value = out; lastDraft = out; dirty = false; hasDraft = true; busy = false;
  $("copied").hidden = true; updateButtons();
}
async function copyText() {
  const T = t(), box = $("text"), v = box.value; if (!v.trim()) return;
  let ok = false;
  try { await navigator.clipboard.writeText(v); ok = true; } catch (e) {
    try { box.focus(); box.select(); ok = document.execCommand("copy"); } catch (e2) {}
  }
  $("copied").textContent = ok ? T.copied : T.copyFail; $("copied").hidden = false;
}
function openGoogle(ev) {
  if (!branch) {
    ev.preventDefault();
    const e = $("branch-err"); e.textContent = t().chooseBranch; e.hidden = false;
    $("branches").scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { sessionStorage.setItem("sh_lang", lang); } catch (e) {}
  renderStatic();
}));
$("make").addEventListener("click", makeDraft);
$("copy").addEventListener("click", copyText);
$("open").addEventListener("click", openGoogle);
$("text").addEventListener("input", () => { dirty = true; });
renderStatic();
</script>
